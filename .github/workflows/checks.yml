name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  controller:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libhidapi-dev libudev-dev libpulse-dev libayatana-appindicator3-dev
      - name: Rust tests
        run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml
      - name: Installer and syntax checks
        run: |
          bash -n install.sh run.sh packaging/omarchy/install.sh
          python3 tests/install-check.py
          node --check ui/main.js
      - name: Browser regression dependencies
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Browser regressions
        run: |
          mkdir -p .impeccable/review
          node tests/ui-check.cjs
