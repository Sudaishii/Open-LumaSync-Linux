<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff3b3b"/>
      <stop offset="20%" stop-color="#ff8c00"/>
      <stop offset="40%" stop-color="#ffd000"/>
      <stop offset="60%" stop-color="#33d17a"/>
      <stop offset="80%" stop-color="#3584e4"/>
      <stop offset="100%" stop-color="#c061cb"/>
    </linearGradient>
    <linearGradient id="rainbow-v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c061cb"/>
      <stop offset="50%" stop-color="#3584e4"/>
      <stop offset="100%" stop-color="#33d17a"/>
    </linearGradient>
    <linearGradient id="rainbow-v2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff3b3b"/>
      <stop offset="50%" stop-color="#ff8c00"/>
      <stop offset="100%" stop-color="#ffd000"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="56" fill="#1a1a2e"/>
  <!-- Glow background -->
  <rect x="32" y="72" width="192" height="18" rx="9" fill="url(#rainbow)" opacity="0.25" filter="url(#glow)"/>
  <rect x="32" y="72" width="10" height="112" rx="5" fill="url(#rainbow-v2)" opacity="0.2" filter="url(#glow)"/>
  <rect x="214" y="72" width="10" height="112" rx="5" fill="url(#rainbow-v)" opacity="0.2" filter="url(#glow)"/>
  <!-- LED bar top -->
  <rect x="32" y="72" width="192" height="18" rx="9" fill="url(#rainbow)"/>
  <!-- LED segments (dots) -->
  <circle cx="52" cy="81" r="4" fill="white" opacity="0.5"/>
  <circle cx="72" cy="81" r="4" fill="white" opacity="0.4"/>
  <circle cx="92" cy="81" r="4" fill="white" opacity="0.5"/>
  <circle cx="112" cy="81" r="4" fill="white" opacity="0.4"/>
  <circle cx="128" cy="81" r="4" fill="white" opacity="0.5"/>
  <circle cx="148" cy="81" r="4" fill="white" opacity="0.4"/>
  <circle cx="168" cy="81" r="4" fill="white" opacity="0.5"/>
  <circle cx="188" cy="81" r="4" fill="white" opacity="0.4"/>
  <circle cx="204" cy="81" r="4" fill="white" opacity="0.5"/>
  <!-- Left strip -->
  <rect x="32" y="72" width="10" height="112" rx="5" fill="url(#rainbow-v2)"/>
  <!-- Right strip -->
  <rect x="214" y="72" width="10" height="112" rx="5" fill="url(#rainbow-v)"/>
  <!-- Monitor silhouette -->
  <rect x="54" y="100" width="148" height="94" rx="8" fill="none" stroke="#555" stroke-width="3"/>
  <rect x="100" y="198" width="56" height="6" rx="3" fill="#555"/>
  <rect x="88" y="206" width="80" height="4" rx="2" fill="#444"/>
</svg>
